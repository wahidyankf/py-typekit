[project]
name = "py-typekit"
version = "0.1.0"
description = "Typed functional primitives for Python: Result, Option, attempt, and pipe, checked by strict Pyright."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["coverage>=7.16", "pyright>=1.1.414", "pytest>=9.1", "ruff>=0.16.8"]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "typekit"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "D1"]
ignore = ["D105"]

[tool.ruff.lint.per-file-ignores]
# Docstrings document the public API; a test is named as a sentence instead.
"tests/**" = ["D1"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["typekit"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# The one exclusion: each `pipe` overload stub, whose `...` body never runs. The implementation stays measured.
exclude_also = ["@overload"]
